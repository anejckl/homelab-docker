global:
  resolve_timeout: 5m

route:
  receiver: ops-agent-relay
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      repeat_interval: 1h
      receiver: ops-agent-relay

receivers:
  - name: ops-agent-relay
    webhook_configs:
      - url: "http://192.168.1.142:8000/api/alerts/webhook"
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/webhook_token
