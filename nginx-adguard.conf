server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Accept-Encoding "";

    sub_filter_once on;
    sub_filter_types text/html;

    location / {
        proxy_pass http://adguard:8082;
        sub_filter '</head>' '<style>body[data-theme="dark"]{background-color:#1e1e2e!important;color:#cdd6f4!important}body[data-theme="dark"] .navbar,body[data-theme="dark"] nav{background-color:#181825!important;border-bottom:1px solid rgba(69,71,90,.4)!important}body[data-theme="dark"] .navbar .nav-link{color:#a6adc8!important}body[data-theme="dark"] .navbar .nav-link.active,body[data-theme="dark"] .navbar .nav-link:hover{color:#cba6f7!important}body[data-theme="dark"] .card,body[data-theme="dark"] .stats-card{background-color:#313244!important;border-color:#45475a!important}body[data-theme="dark"] .card-header{background-color:#181825!important;border-bottom-color:#45475a!important}body[data-theme="dark"] .table{color:#cdd6f4!important}body[data-theme="dark"] .table thead th{background-color:#181825!important;border-color:#45475a!important;color:#a6adc8!important}body[data-theme="dark"] .table td,body[data-theme="dark"] .table th{border-color:#45475a!important}body[data-theme="dark"] .table-hover tbody tr:hover{background-color:rgba(203,166,247,.06)!important}body[data-theme="dark"] .btn-primary{background-color:#cba6f7!important;border-color:#cba6f7!important;color:#1e1e2e!important}body[data-theme="dark"] .btn-primary:hover{background-color:#d4b3ff!important}body[data-theme="dark"] .btn-success{background-color:#a6e3a1!important;border-color:#a6e3a1!important;color:#1e1e2e!important}body[data-theme="dark"] .btn-danger{background-color:#f38ba8!important;border-color:#f38ba8!important;color:#1e1e2e!important}body[data-theme="dark"] .btn-secondary{background-color:#313244!important;border-color:#45475a!important;color:#cdd6f4!important}body[data-theme="dark"] .form-control,body[data-theme="dark"] input,body[data-theme="dark"] select,body[data-theme="dark"] textarea{background-color:#313244!important;border-color:#45475a!important;color:#cdd6f4!important}body[data-theme="dark"] .form-control:focus,body[data-theme="dark"] input:focus{border-color:#cba6f7!important;box-shadow:0 0 0 .2rem rgba(203,166,247,.25)!important}body[data-theme="dark"] .input-group-text{background-color:#181825!important;border-color:#45475a!important;color:#a6adc8!important}body[data-theme="dark"] .dropdown-menu{background-color:#181825!important;border-color:#45475a!important}body[data-theme="dark"] .dropdown-item{color:#cdd6f4!important}body[data-theme="dark"] .dropdown-item:hover{background-color:#313244!important}body[data-theme="dark"] a{color:#89b4fa!important}body[data-theme="dark"] a:hover{color:#cba6f7!important}body[data-theme="dark"] .text-muted{color:#a6adc8!important}body[data-theme="dark"] footer,body[data-theme="dark"] .footer{background-color:#181825!important;border-top:1px solid rgba(69,71,90,.4)!important;color:#a6adc8!important}body[data-theme="dark"] .progress{background-color:#313244!important}body[data-theme="dark"] .progress-bar{background-color:#cba6f7!important}body[data-theme="dark"] .progress-bar.bg-danger{background-color:#f38ba8!important}body[data-theme="dark"] .progress-bar.bg-success{background-color:#a6e3a1!important}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#11111b}::-webkit-scrollbar-thumb{background:#45475a;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#6c7086}</style></head>';
    }
}
