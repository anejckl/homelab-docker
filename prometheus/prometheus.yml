global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["docker-node-exporter-1:9100"]

  - job_name: "pve"
    static_configs:
      - targets:
        - 192.168.1.77
    metrics_path: /pve
    params:
      module: [default]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "gpu-exporter"
    static_configs:
      - targets: ["gpu-exporter:9835"]

  - job_name: "smartctl-exporter"
    static_configs:
      - targets: ["192.168.1.77:9633"]

  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_alive]
    static_configs:
      - targets:
        - http://homarr:7575
        - http://jellyfin:8096
        - http://sonarr:8989
        - http://radarr:7878
        - http://prowlarr:9696
        - http://qbittorrent:8081
        - http://grafana:3000
        - http://adguard:8082
        - http://nextcloud:80
        - http://frigate:5000
        - http://comfyui-nvidia:8188
        - http://open-webui:8080
        - http://192.168.1.1
        - http://100.78.87.63:3001
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "blackbox-https-selfsigned"
    metrics_path: /probe
    params:
      module: [http_alive_insecure_tls]
    static_configs:
      - targets:
        - https://100.111.223.24:8006
        - https://100.78.87.63:9443
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
